services:
  redis-db:
    image: redis:alpine
    container_name: redis-db
    restart: always

  db-init:
    image: postgres:15
    entrypoint: ["sh", "-c", "chown -R 2000:2000 /var/lib/postgresql/data"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db:
    image: postgres:15
    container_name: db
    restart: always
    shm_size: 256m
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: postgres -c 'max_connections=200'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: blockscout/blockscout:6.10.1
    container_name: backend
    restart: always
    stop_grace_period: 5m
    depends_on:
      - db
      - redis-db
      - anvil
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    environment:
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_HTTP_URL: http://anvil:8545
      ETHEREUM_JSONRPC_TRACE_URL: http://anvil:8545
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/blockscout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      NETWORK: EVM
      SUBNETWORK: ${NETWORK_NAME}
      PORT: "4000"
      ECTO_USE_SSL: "false"
      DISABLE_EXCHANGE_RATES: "true"
      SUPPORTED_CHAINS: "[]"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "false"
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "false"
      MICROSERVICE_VISUALIZE_SOL2UML_ENABLED: "false"
      MICROSERVICE_SIG_PROVIDER_ENABLED: "false"

  bc_frontend:
    image: ghcr.io/blockscout/frontend:v1.37.4
    container_name: bc_frontend
    platform: linux/amd64
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_HOST: localhost
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_APP_HOST: localhost
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_NETWORK_NAME: ${NETWORK_NAME}
      NEXT_PUBLIC_NETWORK_SHORT_NAME: ${NETWORK_NAME}
      NEXT_PUBLIC_NETWORK_ID: ${CHAIN_ID}
      NEXT_PUBLIC_NETWORK_RPC_URL: http://localhost:8545
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: ${CURRENCY_SYMBOL}
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: ${CURRENCY_SYMBOL}
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_HOMEPAGE_CHARTS: "['daily_txs']"
      NEXT_PUBLIC_IS_TESTNET: "true"
      NEXT_PUBLIC_API_SPEC_URL: https://raw.githubusercontent.com/blockscout/blockscout-api-v2-swagger/main/swagger.yaml
      NEXT_PUBLIC_STATS_API_HOST: ""
      NEXT_PUBLIC_AD_BANNER_PROVIDER: none
      NEXT_PUBLIC_WEB3_WALLETS: "['metamask']"

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    depends_on:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: anvil
    restart: always
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2"]
    ports:
      - "8545:8545"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
